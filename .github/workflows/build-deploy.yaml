name: Build and push and deploy
on:
  push:
    branches:
      - 'main'
  pull_request:
    branches:
      - 'main'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Miljø å deploye til'
        required: true
        type: choice
        options:
          - u1
          - q1
          - prod
jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Cache SonarCloud packages
        uses: actions/cache@v5
        with:
          path: ~/.sonar/cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar

      - name: Build with Maven
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: mvn -B verify -Pcoverage --settings .github/maven-settings.xml

      - name: Sonar analyze
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: mvn -B org.sonarsource.scanner.maven:sonar-maven-plugin:sonar -Dsonar.qualitygate.wait=true --settings .github/maven-settings.xml

      - uses: nais/docker-build-push@751a312f0803eb96a05a41fadf51be19b7be362c # v0
        id: docker-push
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        with:
          team: team-oebs
          tenant: nav
          push_image: true
          pull: true
          dockerfile: Dockerfile
          docker_context: .
          cache_from: type=gha
          cache_to: type=gha,mode=max
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          salsa: true

      - name: Deploy til U1
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'u1'
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/nais-u1.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

      - name: Deploy til Q1
        if: github.event_name == 'workflow_dispatch' && inputs.environment == 'q1'
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/nais-q1.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

      - name: Deploy til produksjon
        if: github.ref == 'refs/heads/main' && ((github.event_name == 'push') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod'))
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: prod-fss
          RESOURCE: .nais/nais-p.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
