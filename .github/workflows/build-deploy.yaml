name: Build and push and deploy
on:
  push:
    branches:
      - 'dev/**'
      - 'main'
  pull_request:
    branches:
      - 'dev/**'
      - 'main'
  workflow_dispatch:
    inputs:
      environment:
        description: 'Miljø å deploye til'
        required: true
        type: choice
        options:
          - u1
          - q1
          - prod
jobs:
  build_and_push:
    permissions:
      contents: "read"
      id-token: "write"
      packages: "read"
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: maven

      - name: Build with Maven
        run: mvn package -DskipTests --settings .github/maven-settings.xml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: nais/docker-build-push@v0
        id: docker-push
        if: github.event_name != 'pull_request'
        with:
          team: team-oebs
          tenant: nav
          push_image: true
          pull: true
          dockerfile: Dockerfile
          docker_context: .
          cache_from: type=gha
          cache_to: type=gha,mode=max
          project_id: ${{ vars.NAIS_MANAGEMENT_PROJECT_ID }}
          identity_provider: ${{ secrets.NAIS_WORKLOAD_IDENTITY_PROVIDER }}
          salsa: true

      - name: Deploy til U1
        if: startsWith(github.ref, 'refs/heads/dev/u1') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'u1')
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/nais-u1.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

      - name: Deploy til Q1
        if: startsWith(github.ref, 'refs/heads/dev/q1') || (github.event_name == 'workflow_dispatch' && inputs.environment == 'q1')
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: dev-fss
          RESOURCE: .nais/nais-q1.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}

      - name: Deploy til produksjon
        if: github.ref == 'refs/heads/main' || (github.event_name == 'workflow_dispatch' && inputs.environment == 'prod')
        uses: nais/deploy/actions/deploy@823ec9b7e305ce7cf911d0f9a25f7da9d7486cf2
        env:
          CLUSTER: prod-fss
          RESOURCE: .nais/nais-p.yaml
          IMAGE: ${{ steps.docker-push.outputs.image }}
