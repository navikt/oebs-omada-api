apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  name: oebs-omada-api
  namespace: team-oebs
  labels:
    app: oebs-omada-api
    team: team-oebs
  annotations:
    # Oracle concurrent program (start_import_ident_melding) kan bruke opptil 2 min.
    # Settes litt over Oracle socket-timeout (110 s) i application.yaml.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 3
    max: 3

  resources:
    requests:
      cpu: 100m
      memory: 512Mi
    limits:
      memory: 1Gi

  env:
    - name: JDK_JAVA_OPTIONS
      value: "-XX:MaxRAMPercentage=60.0 -XX:InitialRAMPercentage=40.0 -XX:MaxMetaspaceSize=200m -XX:+HeapDumpOnOutOfMemoryError -XX:HeapDumpPath=/tmp/heapdump.hprof"

  azure:
    application:
      enabled: true
      accessPolicy:
        inbound:
          rules:

      tenant: nav.no
  envFrom:
    - secret: oebs-omada-prod

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
    - "https://oebs-omada-api.intern.nav.no"