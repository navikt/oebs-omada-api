apiVersion: nais.io/v1alpha1
kind: Application

metadata:
  name: oebs-omada-api
  namespace: team-oebs
  labels:
    app: oebs-omada-api
    team: team-oebs
  annotations:
    # Oracle concurrent program (start_import_ident_melding) kan bruke opptil 2 min.
    # Settes litt over Oracle socket-timeout (110 s) i application.yaml.
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 3
    max: 3
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java

  resources:
    requests:
      cpu: 150m
      memory: 768Mi
    limits:
      memory: 1536Mi


  azure:
    application:
      enabled: true

      tenant: nav.no
  env:
    - name: SPRINGDOC_API_DOCS_ENABLED
      value: "false"
    - name: SPRINGDOC_SWAGGER_UI_ENABLED
      value: "false"
  envFrom:
    - secret: oebs-omada-prod

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
    - "https://oebs-omada-api.intern.nav.no"
