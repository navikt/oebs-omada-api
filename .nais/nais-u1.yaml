apiVersion: nais.io/v1alpha1
kind: Application
metadata:
  name: oebs-omada-api-u1
  namespace: team-oebs
  labels:
    app: oebs-omada-api-u1
    team: team-oebs
  annotations:
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"

spec:
  image: {{ image }}
  port: 8080
  replicas:
    min: 1
    max: 1
  observability:
    autoInstrumentation:
      enabled: true
      runtime: java

  resources:
    requests:
      cpu: 50m
      memory: 864Mi
    limits:
      memory: 928Mi
  azure:
    application:
      enabled: true
  accessPolicy:
    inbound:
      rules:
        - application: azure-token-generator
          namespace: nais
          cluster: dev-gcp
  envFrom:
    - secret: oebs-omada-u1

  prometheus:
    enabled: true
    path: /actuator/prometheus

  ingresses:
     - "https://oebs-omada-api-u1.intern.dev.nav.no"
