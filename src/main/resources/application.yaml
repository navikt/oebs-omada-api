
server:
  port: 8080

# Application metadata
OEBS_ENV: ${OEBS_ENV:LOCAL}
APP_VERSION: ${APP_VERSION:0.4.6}
APP_UPDATE: ${APP_UPDATE:2026-02-23}
APP_NAME: ${APP_NAME:oebs-omada-api}

oebs:
  scim:
    base-url: ${SCIM_BASE_URL}
    sync-enabled: ${SCIM_SYNC_ENABLED:true}
  plsql:
    insert-procedure: ${PLSQL_INSERT_PROCEDURE:APPS.XXRTV_INT_OMADA_INSERT_MESSAGE.InsertOmadaMessage}
    sync-procedure: ${PLSQL_SYNC_PROCEDURE:APPS.XXRTV_OMADA_JSON_IDENT_PKG.start_import_ident_melding}
    org-id: ${PLSQL_ORG_ID:0}

no.nav.security.jwt:
   issuer:
     azure:
       accepted_audience: ${AZURE_ACCEPTED_AUDIENCE:no-audience}
       discovery-url: ${AZURE_DISCOVERY_URL:https://not-configured.invalid}

spring:
  profiles:
     active: nais
  autoconfigure:
    exclude:
      - org.apache.directory.scim.spring.ScimpleSpringConfiguration
  datasource:
    driver-class-name: oracle.jdbc.OracleDriver
    username: ${APPS_USER}
    password: ${APPS_PASSWORD}
    url: ${DB_URL}
    hikari:
      connection-init-sql: >
        ALTER SESSION SET
          NLS_LANGUAGE    = 'NORWEGIAN'
          NLS_TERRITORY   = 'NORWAY'
          NLS_DATE_FORMAT = 'YYYY-MM-DD'
  jpa:
    database-platform: org.hibernate.dialect.OracleDialect
    hibernate:
      ddl-auto: none
    show-sql: false
    open-in-view: false

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics

springdoc:
  packagesToScan: no.nav.oebs.api.controller
  override-with-generic-response: false
  remove-broken-reference-definitions: false
  swagger-ui:
    disable-swagger-default-url: true
    tags-sorter: alpha

logging:
  level:
    no.nav.security.token.support: DEBUG
    no.nav.security.jwt: DEBUG
